name: Preise aktualisieren

on:
  schedule:
    # GitHub lässt geplante Läufe oft aus – deshalb 6-mal pro Stunde fragen.
    # Läufe ohne neuen Blizzard-Stand enden nach Sekunden und veröffentlichen nichts.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preise
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bisherige Daten holen
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C out
          fi

      - name: Preise abrufen
        id: preise
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: node update.js out

      - name: Daten-Branch veroeffentlichen
        if: steps.preise.outputs.changed == 'true'
        run: |
          cd out
          git init -q -b data
          git add -A
          git -c user.name="preis-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Preise $(date -u +'%d.%m.%Y %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      # GitHub pausiert geplante Jobs nach 60 Tagen ohne Commit im Haupt-Branch.
      # Alle 40 Tage ein kleiner Commit hält den Zeitplan am Leben.
      - name: Zeitplan wachhalten
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( now - last )) -gt $(( 40 * 86400 )) ]; then
            date -u +'%d.%m.%Y %H:%M UTC' > .keepalive
            git add .keepalive
            git -c user.name="preis-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Zeitplan wachhalten"
            git push -q origin HEAD:main
          fi
