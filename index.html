<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forever AH · WoW Forever</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forever AH">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121418">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#121418; --shell:#0C0E11; --card:#1B1E24; --card2:#252932; --line:#2A2E36;
    --text:#ECEDEF; --muted:#9BA1AC; --soft:#C4C8D0; --nav:#15171C;
    --gold:#E8B44C; --gold-ink:#1A1408; --gold-soft:#E8C985; --gold-bg:#1D1A12; --gold-line:#4A3C1C;
    --loss:#F28B8B; --loss-bg:#211517; --loss-line:#5A2E33;
    --up:#6FD88A; --up-bg:#132018; --up-line:#2F5A3A;
    --down:#8AB4F8; --down-bg:#121A26; --down-line:#2C3F5E;
    --note-bg:#1A1710; --note-line:#6B5626;
    --coin-g:#E8B44C; --coin-s:#C9CED6; --coin-c:#D08A5A;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#F6F4EF; --shell:#E9E6DF; --card:#FFFFFF; --card2:#EFECE5; --line:#DDD8CE;
    --text:#1D1F24; --muted:#5E6470; --soft:#3F444E; --nav:#FFFFFF;
    --gold:#9A6A06; --gold-ink:#FFFFFF; --gold-soft:#7A5508; --gold-bg:#FBF3E2; --gold-line:#E6CF9C;
    --loss:#B3261E; --loss-bg:#FCEEEE; --loss-line:#EBC0BD;
    --up:#1E7A3A; --up-bg:#EAF6EE; --up-line:#B9DFC4;
    --down:#1F5BB8; --down-bg:#EAF1FC; --down-line:#BCD0F1;
    --note-bg:#FBF3E2; --note-line:#E0C383;
    --coin-g:#9A6A06; --coin-s:#5F6670; --coin-c:#9C5426;
    color-scheme: light;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F6F4EF; --shell:#E9E6DF; --card:#FFFFFF; --card2:#EFECE5; --line:#DDD8CE;
      --text:#1D1F24; --muted:#5E6470; --soft:#3F444E; --nav:#FFFFFF;
      --gold:#9A6A06; --gold-ink:#FFFFFF; --gold-soft:#7A5508; --gold-bg:#FBF3E2; --gold-line:#E6CF9C;
      --loss:#B3261E; --loss-bg:#FCEEEE; --loss-line:#EBC0BD;
      --up:#1E7A3A; --up-bg:#EAF6EE; --up-line:#B9DFC4;
      --down:#1F5BB8; --down-bg:#EAF1FC; --down-line:#BCD0F1;
      --note-bg:#FBF3E2; --note-line:#E0C383;
      --coin-g:#9A6A06; --coin-s:#5F6670; --coin-c:#9C5426;
      color-scheme: light;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--shell);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  a{color:var(--gold)}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
  .listcol{display:flex;flex-direction:column;min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  body::before{content:'';position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--bg);z-index:20}
  .sticky{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 20px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
  .toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
  h1{margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:24px;font-weight:600;letter-spacing:-.01em}
  h2.sec{margin:8px 0 0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .fresh{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .stats{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--soft);min-height:40px}
  .stats b{color:var(--text)}
  .iconbtn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--soft);cursor:pointer}
  .iconbtn:disabled{opacity:.35;cursor:default}
  .seg{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px}
  .seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--soft);font-weight:600;font-size:14px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--soft);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
  .search{width:100%;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
  .search::placeholder{color:var(--muted)}
  .tools{display:flex;gap:8px;align-items:center}
  .tools select{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 10px;font-size:14px}
  .toggle{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer;white-space:nowrap}
  .toggle[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
  .listhead{position:relative;padding:6px 20px 6px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .sortbtn{display:flex;align-items:center;gap:4px;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer}
  .sortbtn span{color:var(--muted);font-size:11px}
  .sortmenu{position:absolute;right:16px;top:calc(100% - 2px);z-index:30;min-width:240px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.25);overflow:hidden}
  .sortmenu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font-size:15px;text-align:left;cursor:pointer}
  .sortmenu button:last-child{border-bottom:0}
  .sortmenu button[aria-checked="true"]{color:var(--gold);font-weight:600}
  .list{flex:1;padding:0 20px 24px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 8px 8px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;cursor:pointer;width:100%}
  .row.sel{border-color:var(--gold)}
  .row:focus:not(:focus-visible){outline:none}
  .rank{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--card2);font-size:13px;font-weight:600;color:var(--soft)}
  .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .name.wrap{white-space:normal;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
  .meta{font-size:12px;color:var(--muted)}
  .mid .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .right .meta{white-space:nowrap}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .profit{font-size:15px;font-weight:700}
  .neg{color:var(--loss)}
  .star{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:10px}
  .star[aria-pressed="true"]{color:var(--gold)}
  .coin{display:inline-flex;align-items:baseline;gap:1px;margin-left:4px}
  .coin:first-child{margin-left:0}
  .coin i{font-style:normal;font-size:.8em;font-weight:700}
  .cg i{color:var(--coin-g)} .cs i{color:var(--coin-s)} .cc i{color:var(--coin-c)}
  .q0{color:#9D9D9D} .q2{color:#1EFF00} .q3{color:#3A9BFF} .q4{color:#B65DF5} .q5{color:#FF8000}
  :root[data-theme="light"] .q2{color:#178A17} :root[data-theme="light"] .q3{color:#0B5FC2} :root[data-theme="light"] .q4{color:#7B2FC2} :root[data-theme="light"] .q5{color:#B85C00} :root[data-theme="light"] .q0{color:#777}
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .q2{color:#178A17} :root:not([data-theme="dark"]) .q3{color:#0B5FC2} :root:not([data-theme="dark"]) .q4{color:#7B2FC2} :root:not([data-theme="dark"]) .q5{color:#B85C00} :root:not([data-theme="dark"]) .q0{color:#777} }
  .ic{position:relative;flex:none;width:36px;height:36px;border-radius:8px;border:2px solid var(--qb,var(--line));background:var(--card2);display:inline-flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted)}
  .ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ic.lg{width:52px;height:52px;border-radius:10px}
  .ic.sm{width:28px;height:28px;border-radius:6px;border-width:1.5px}
  .qb0{--qb:#7A7A7A} .qb1{--qb:var(--line)} .qb2{--qb:#1EBE00} .qb3{--qb:#2F86E8} .qb4{--qb:#A44BE8} .qb5{--qb:#FF8000}
  .titlerow{display:flex;align-items:center;gap:12px}
  .trend{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .trend.up{color:var(--up)} .trend.down{color:var(--down)} .trend.flat{color:var(--muted)}
  .warn{color:var(--gold-soft)}
  .credit{margin:10px 0 0;font-size:11px;color:var(--muted);text-align:center;line-height:1.5}
  .empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:12px;border:1px dashed var(--line);border-radius:14px}
  .btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:14px;cursor:pointer}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;z-index:10;display:flex;border-top:1px solid var(--line);background:var(--nav);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
  nav.tabs button{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer}
  nav.tabs button[aria-current="page"]{color:var(--gold);font-weight:600}
  /* Detail */
  .pane{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;display:none;padding-bottom:env(safe-area-inset-bottom)}
  .pane.open{display:block;animation:slide .22s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
  .pane-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
  .pane-head .pos{flex:1;text-align:center;font-size:13px;color:var(--muted)}
  .pane-body{padding:16px 20px 32px;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
  .pane-empty{display:none}
  .hero{display:flex;justify-content:space-between;align-items:flex-end;padding:16px;border-radius:16px;background:var(--gold-bg);border:1px solid var(--gold-line)}
  .hero.neg{background:var(--loss-bg);border-color:var(--loss-line)}
  .hero .lbl{font-size:12px;color:var(--muted)}
  .hero .big{font-family:'Space Grotesk',Inter,sans-serif;font-size:30px;font-weight:700}
  .hero .marge{font-size:15px;font-weight:600;color:var(--gold-soft)}
  .hero.neg .marge{color:var(--loss)}
  .verdict{padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
  .verdict b{font-size:15px}
  .verdict.up{border-color:var(--up-line);background:var(--up-bg)} .verdict.up b{color:var(--up)}
  .verdict.down{border-color:var(--down-line);background:var(--down-bg)} .verdict.down b{color:var(--down)}
  .verdict span{font-size:13px;color:var(--soft)}
  .note{margin:0;padding:8px 12px;border:1px dashed var(--note-line);border-radius:10px;font-size:13px;color:var(--gold-soft);background:var(--note-bg)}
  .box{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px}
  .line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
  .line:last-child{border-bottom:0}
  .line.total{font-weight:600}
  button.line{width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
  .box button.line:last-child{border-bottom:0}
  .tag{padding:3px 8px;border-radius:6px;background:var(--card2);font-size:11px;font-weight:600;color:var(--soft);white-space:nowrap}
  .tag.bad{background:var(--loss-bg);color:var(--loss)}
  .hint{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:18px;font-weight:600;cursor:pointer}
  .stepper input{width:64px;height:44px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:16px}
  .quick{display:flex;gap:6px;flex-wrap:wrap}
  .quick .chip{min-height:36px}
  .bar{position:relative;height:8px;border-radius:4px;background:var(--card2);margin:4px 0 2px}
  .bar i{position:absolute;top:-3px;width:3px;height:14px;border-radius:2px}
  .skill{width:80px;height:40px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .hidden{display:none !important}
  .row.dim{opacity:.55}
  .timing-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--card2);color:var(--soft)}
  .timing-badge.high{background:var(--up-bg);color:var(--up)} .timing-badge.mid{background:var(--gold-bg);color:var(--gold-soft)}
  .timing-rec{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
  .timing-rec div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
  .timing-rec .lbl{font-size:12px;color:var(--muted)} .timing-rec b{font-size:15px}
  .heat{display:grid;grid-template-columns:28px repeat(6,1fr);gap:3px;margin-top:12px;font-size:11px}
  .heat .hx{text-align:left;color:var(--muted);padding-left:2px} .heat .hy{color:var(--muted);align-self:center}
  .heat .hc{height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
  .heat .hc.now{outline:2px solid var(--gold);outline-offset:-1px}
  .chip[aria-pressed="true"] .meta{color:inherit;opacity:.8}
  .chip[aria-pressed="true"] span[class^="q"]{color:inherit}
  .fsum{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:13px;color:var(--soft)}
  .fsum span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tools .search{flex:1;min-width:0}
  #factionSel{flex:none;width:auto;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 10px;font-size:14px;color:var(--text)}
  .sheethead{display:flex;justify-content:space-between;align-items:center}
  .linkbtn{border:0;background:none;color:var(--gold);font-size:14px;font-weight:600;cursor:pointer}
  .fgroup{display:flex;flex-direction:column;gap:6px}
  .flabel{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .wrapchips{display:flex;flex-wrap:wrap;gap:6px}
  .sheet select{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 10px;font-size:14px;color:var(--text)}
  .switch{flex:none;width:44px;height:26px;border-radius:13px;border:0;background:var(--card2);position:relative;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
  .switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:var(--muted);transition:left .15s}
  .switch[aria-checked="true"]{background:var(--gold)} .switch[aria-checked="true"] i{left:21px;background:var(--gold-ink)}
  .skill:disabled{opacity:.4}
  .charttip{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:10px;background:var(--text);color:var(--bg);font-size:12px;pointer-events:none;white-space:nowrap}
  .charttip b{font-size:14px}
  .skillrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--soft)}
  .tools select{flex:1;min-width:0}
  .tools .toggle{padding:0 10px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{flex:none;border-radius:9px}
  .backbtn{display:flex;align-items:center;gap:2px;min-height:40px;padding:0 10px 0 4px;border:0;background:none;color:var(--gold);font-size:15px;font-weight:600;cursor:pointer;border-radius:10px}
  .favbtn{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--line);background:var(--card);color:var(--soft);font-size:13px;font-weight:600;cursor:pointer;border-radius:10px}
  .favbtn[aria-pressed="true"]{color:var(--gold);border-color:var(--gold-line);background:var(--gold-bg)}
  .pane-foot{position:sticky;bottom:0;z-index:2;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
  .pane-foot button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;cursor:pointer;color:var(--text)}
  .pane-foot button:disabled{opacity:.35;cursor:default}
  .pane:not(.open) .pane-foot{display:none}
  @media (max-width:959px){ body.detail #upd{display:none} }
  @media (max-width:480px){ .row .rank{display:none} .row{gap:8px;padding-left:10px} .row .star{width:34px} }
  .upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:55;width:min(560px,calc(100% - 24px));display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--gold-line);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:14px}
  .upd b{color:var(--gold)}
  .upd span{flex:1}
  .upd .btn{min-height:40px}
  .sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:min(560px,100%);max-height:80vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}

  function loadChart(id){

  function tickTxt(c){ var p = parts(c), o = []; if (p.g) o.push(p.g+'g'); if (p.s) o.push(p.s+'s'); if (p.k || !o.length) o.push(p.k+'k'); return o.join(' '); }
  var WDN = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  function cellTxt(c){ var b = c % 6; return WDN[Math.floor(c / 6)]+' '+(b*4)+'–'+(b*4+4)+' Uhr'; }
  function nowCell(){ var d = new Date(new Date().toLocaleString('en-US', { timeZone:'Europe/Berlin' })); return ((d.getDay() + 6) % 7) * 6 + Math.floor(d.getHours() / 4); }

  function timingHtml(e){
    if (!e || e[0] < 24) return '<span class="hint">Noch zu wenig Daten. Ein Muster entsteht, sobald das Item mindestens einen Tag lang mit 5 oder mehr Auktionen im AH war.</span>';
    var P = e[1], Wt = e[2], Q = e[3], ok = function(c){ return P[c] != null && Wt[c] >= 10; };
    var cells = []; for (var c = 0; c < 42; c++) if (ok(c)) cells.push(c);
    if (cells.length < 6) return '<span class="hint">Noch zu wenig Daten für ein Muster.</span>';
    var lo = cells.reduce(function(a, c){ return P[c] < P[a] ? c : a; }), hi = cells.reduce(function(a, c){ return P[c] > P[a] ? c : a; });
    var weeks = e[0] / 168, conf = weeks < 1 ? ['erste Tendenz','weniger als 1 Woche Daten'] : weeks < 3 ? ['noch unsicher', Math.floor(weeks)+(Math.floor(weeks)===1?' Woche':' Wochen')+' Daten'] : ['belastbar', Math.floor(weeks)+' Wochen Daten'];
    var spread = P[hi] - P[lo], now = nowCell();
    var qc = cells.filter(function(c){ return Q[c] != null; }), qlo = qc.length > 5 ? qc.reduce(function(a, c){ return Q[c] < Q[a] ? c : a; }) : null;
    var h = '<div class="timing-badge '+(weeks < 1 ? 'low' : weeks < 3 ? 'mid' : 'high')+'">'+conf[0]+' · '+conf[1]+'</div>';
    if (spread < 30) h += '<p class="hint" style="margin:8px 0">Kein deutliches Muster – der Preis schwankt über die Woche kaum (unter 3 %). Der Zeitpunkt ist hier ziemlich egal.</p>';
    else h += '<div class="timing-rec"><div><span class="lbl">Kaufen</span><b>'+cellTxt(lo)+'</b><span class="trend down">'+relTxt(P[lo])+'</span></div>'
      + '<div><span class="lbl">Verkaufen</span><b>'+cellTxt(hi)+'</b><span class="trend up">'+relTxt(P[hi])+'</span></div></div>';
    if (qlo != null && Q[qlo] < -150) h += '<p class="hint" style="margin:6px 0 0">Wenig Konkurrenz beim Verkaufen: <b>'+cellTxt(qlo)+'</b> ('+relTxt(Q[qlo])+' Angebot).</p>';
    var mx = Math.max(30, Math.abs(P[lo]), Math.abs(P[hi]));
    h += '<div class="heat" role="img" aria-label="Preis nach Wochentag und Uhrzeit"><span></span>'+[0,4,8,12,16,20].map(function(x){ return '<span class="hx">'+x+'</span>'; }).join('');
    for (var d = 0; d < 7; d++) {
      h += '<span class="hy">'+WDN[d]+'</span>';
      for (var b = 0; b < 6; b++) {
        var c2 = d * 6 + b, v = ok(c2) ? P[c2] : null, t = v == null ? 0 : Math.max(-1, Math.min(1, v / mx));
        var bg = v == null ? 'var(--card2)' : t < 0 ? 'rgba(46,160,90,'+(0.15 + 0.75 * -t).toFixed(2)+')' : 'rgba(214,69,65,'+(0.15 + 0.75 * t).toFixed(2)+')';
        h += '<span class="hc'+(c2 === now ? ' now' : '')+'" style="background:'+bg+'" title="'+cellTxt(c2)+(v == null ? ': keine Daten' : ': '+relTxt(v))+'">'+(v == null ? '' : Math.round(v / 10))+'</span>';
      }
    }
    h += '</div><p class="hint" style="margin:6px 0 0">Werte in % ggü. dem Tagesschnitt · grün = günstig, rot = teuer · umrandet = jetzt'+(ok(now) ? ' ('+relTxt(P[now])+')' : '')+' · Zeiten: Serverzeit (Berlin)</p>';
    return h;
  }
  function niceStep(span){ var raw = span / 3, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
  function chartSvg(pts, long){
    var W = 600, H = 300, L = 118, R = 14, T = 18, B = 40;
    var xs = pts.map(function(p){ return p[0]; }), ys = pts.map(function(p){ return p[1]; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var mid = (y0 + y1) / 2, span = Math.max(y1 - y0, mid * 0.2, 4);
    var step = niceStep(span); y0 = Math.max(0, Math.floor((mid - span / 2) / step) * step); y1 = Math.ceil((mid + span / 2) / step) * step; if (y1 <= y0) y1 = y0 + step;
    var X = function(x){ return L + (x - x0) / ((x1 - x0) || 1) * (W - L - R); }, Y = function(y){ return T + (1 - (y - y0) / (y1 - y0)) * (H - T - B); };
    var line = pts.map(function(p, i){ return (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1); }).join('');
    var area = line + 'L' + X(x1).toFixed(1) + ' ' + (H - B) + 'L' + X(x0).toFixed(1) + ' ' + (H - B) + 'Z';
    var last = pts[pts.length - 1], hi = pts.reduce(function(a, p){ return p[1] > a[1] ? p : a; }), lo = pts.reduce(function(a, p){ return p[1] < a[1] ? p : a; });
    var avg = Math.round(ys.reduce(function(a, b){ return a + b; }, 0) / ys.length);
    var g = '';
    for (var v = y0; v <= y1 + step / 2; v += step) g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(Y(v)+7).toFixed(1)+'" font-size="22" fill="var(--muted)" text-anchor="end">'+tickTxt(Math.round(v))+'</text>';
    // Datumsmarken: 7 Tage täglich (Mitternacht), 30 Tage wöchentlich
    var day = 864e5, d0 = new Date(x0); d0.setHours(0,0,0,0); var t = d0.getTime() + day, every = long ? 7 : 1, k = 0, xt = '';
    for (; t < x1; t += day, k++) { if (k % every) continue; var xx = X(t); if (xx < L + 30 || xx > W - R - 30) continue; xt += '<line x1="'+xx.toFixed(1)+'" x2="'+xx.toFixed(1)+'" y1="'+(H-B)+'" y2="'+(H-B+4)+'" stroke="var(--muted)"/><text x="'+xx.toFixed(1)+'" y="'+(H-10)+'" font-size="22" fill="var(--muted)" text-anchor="middle">'+dd(t)+'</text>'; }
    var ya = Y(avg), al = 'Ø '+moneyTxt(avg);
    return '<div class="chartwrap" style="position:relative"><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Preisverlauf Marktpreis" style="display:block;touch-action:pan-y" data-x0="'+x0+'" data-x1="'+x1+'" data-l="'+L+'" data-r="'+R+'" data-w="'+W+'">'
      + g + '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="var(--muted)" stroke-width="1"/>' + xt
      + '<path d="'+area+'" fill="var(--gold)" fill-opacity=".12"/>'
      + '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ya.toFixed(1)+'" y2="'+ya.toFixed(1)+'" stroke="var(--soft)" stroke-dasharray="5 4"/>'
      + '<text x="'+(W-R-4)+'" y="'+(ya - 8).toFixed(1)+'" font-size="22" fill="var(--soft)" text-anchor="end" font-weight="600">'+al+'</text>'
      + '<path d="'+line+'" fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linejoin="round"/>'
      + '<circle cx="'+X(last[0]).toFixed(1)+'" cy="'+Y(last[1]).toFixed(1)+'" r="4.5" fill="var(--gold)"/>'
      + '<g id="chartCur" style="display:none"><line id="ccL" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--soft)"/><circle id="ccP" r="6" fill="var(--gold)" stroke="var(--bg)" stroke-width="2"/></g>'
      + '</svg>'
      + '<div class="charttip hidden" id="chartTip"></div></div>'
      + '<div class="line" style="padding:8px 0 0;border:0;font-size:13px"><span class="meta">Hoch '+moneyTxt(hi[1])+' · Tief '+moneyTxt(lo[1])+'</span><span class="meta">'+pts.length+(long?' Tage':' Std.')+'</span></div>';
  }
  var CHART = null;
  function chartPoint(e){
    var svg = e.target.closest && e.target.closest('#chart svg'); if (!svg || !CHART) return;
    var rc = svg.getBoundingClientRect(), cx = ((e.touches ? e.touches[0].clientX : e.clientX) - rc.left) / rc.width * 600;
    var pts = CHART.pts, best = pts[0], bd = 1e9;
    pts.forEach(function(p){ var d = Math.abs(CHART.X(p[0]) - cx); if (d < bd) { bd = d; best = p; } });
    var px = CHART.X(best[0]), py = CHART.Y(best[1]);
    $('chartCur').style.display = ''; $('ccL').setAttribute('x1', px); $('ccL').setAttribute('x2', px); $('ccP').setAttribute('cx', px); $('ccP').setAttribute('cy', py);
    var tip = $('chartTip'); tip.classList.remove('hidden');
    tip.innerHTML = '<b>'+moneyTxt(best[1])+'</b><span>'+(CHART.long ? dd(best[0]) : dt(best[0]))+'</span>';
    var left = px / 600 * rc.width; tip.style.left = Math.max(4, Math.min(rc.width - tip.offsetWidth - 4, left - tip.offsetWidth / 2)) + 'px';
  }
  function shoppingText(){
    var id = sel.slice(2), rc = recipe(id), c = calc(rc), qty = Math.max(1, S.qty[id] || 1);
    var t = ['Einkaufsliste: '+qty+'× '+name(rc.out)+' ('+FNAME[S.faction]+', Normal)'];
    c.mats.forEach(function(m){ t.push('- '+(m.qty*qty)+'× '+name(m.id)+(m.p == null ? ' (kein AH-Preis)' : ' – ca. '+moneyTxt(m.p*m.qty*qty))); });
    t.push('Kosten gesamt: '+moneyTxt(c.cost*qty)+' · Gewinn: '+moneyTxt(c.profit*qty));
    return t.join('\n');
  }
  function copy(text){
    function fallback(){ var ta = document.createElement('textarea'); ta.className = 'copy'; ta.value = text; document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch(e){} ta.remove(); toast(ok ? 'Einkaufsliste kopiert' : 'Kopieren nicht möglich'); }
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast('Einkaufsliste kopiert'); }, fallback); else fallback(); } catch(e){ fallback(); }
  }

  // ---------- Navigation ----------
  function keyToHash(k){ return (k[0]==='r' ? 'rezept-' : 'item-') + k.slice(2); }

  }
  function closeDetail(){ if (openedInApp && window.innerWidth < 960) history.back(); else location.hash = S.tab; }
  function step(d){ var i = ctx.indexOf(sel), j = i + d; if (i >= 0 && j >= 0 && j < ctx.length) openDetail(ctx[j], true); }

  var lastTab = null;
  function route(){
    var h = (location.hash || '').slice(1);
    var m = h.match(/^(rezept|item)-(\d+)$/);
    if (m) {
      sel = (m[1]==='rezept' ? 'r:' : 'i:') + m[2];
      if (lastTab !== S.tab) { render(); lastTab = S.tab; }
      $('pane').classList.add('open');

      if (window.innerWidth < 960) document.body.style.overflow = 'hidden';
      document.body.classList.add('detail');
      return;
    }
    var tab = ['rezepte','markt','merkliste','einstellungen'].indexOf(h) >= 0 ? h : S.tab;
    sel = null; openedInApp = false;
    $('pane').classList.remove('open');
    document.body.style.overflow = '';
    document.body.classList.remove('detail');
    var changed = tab !== S.tab || lastTab !== tab;
    S.tab = tab; save();
    if (changed) { render(); lastTab = tab; window.scrollTo(0,0); }
    else document.querySelectorAll('.row.sel').forEach(function(r){ r.classList.remove('sel'); });
  }
  window.addEventListener('hashchange', route);

  // ---------- Ereignisse ----------
  document.addEventListener('click', function(e){
    var t = e.target.closest('button, [data-open]'); if (!t) return;
    if (t.dataset.fav) { e.stopPropagation(); toggleFav(t.dataset.fav); render(); return; }
    if (t.id === 'paneStar') { toggleFav(sel); render(); return; }
    if (t.id === 'updBtn') { location.replace(location.pathname + '?v=' + encodeURIComponent(t.dataset.v) + location.hash); return; }
    if (t.id === 'sheetOk') { closeSheet(); return; }
    if (t.id === 'filterBtn') { openFilter(); return; }
    if (t.id === 'sortBtn') { var mm = $('sortMenu'); if (mm) mm.remove(); else $('listhead').insertAdjacentHTML('beforeend', sortMenu()); return; }
    if (t.dataset.sortv) { setSort(t.dataset.sortv); return; }
    if (t.id === 'fReset' && S.tab === 'markt') { S.mMin5 = false; S.mQual = []; S.mDev = ''; S.mMine = false; save(); refreshFilter(); return; }
    if (t.id === 'mMin5') { S.mMin5 = !S.mMin5; save(); refreshFilter(); return; }
    if (t.id === 'mMine') { S.mMine = !S.mMine; save(); refreshFilter(); return; }

    if (t.id === 'shareBtn') { shareApp(); return; }

    if (t.dataset.fprof) { S.prof = t.dataset.fprof; S.rcat = ''; save(); refreshFilter(); return; }
    if (t.dataset.group) { S.group = t.dataset.group; save(); render(); return; }
    if (t.dataset.toggleprof) { var hp = S.hiddenProfs = (S.hiddenProfs || []).slice(), ix = hp.indexOf(t.dataset.toggleprof); if (ix >= 0) hp.splice(ix, 1); else hp.push(t.dataset.toggleprof); PROFS = ['Alle'].concat(ALLPROFS.filter(profOn)); if (!profOn(S.prof)) S.prof = 'Alle'; save(); render(); return; }
    if (t.id === 'minAuc') { S.minAuc = !S.minAuc; save(); filterOpen ? refreshFilter() : render(); return; }
    if (t.id === 'newsBtn') { showNews(true); return; }
    if (t.id === 'checkBtn') { checkVersion(true); return; }
    if (t.dataset.tab) { location.hash = t.dataset.tab; if (location.hash.slice(1) === t.dataset.tab) route(); return; }
    if (t.dataset.open) { openDetail(t.dataset.open, false); return; }
    if (t.hasAttribute('data-close')) { closeDetail(); return; }
    if (t.dataset.nav) { step(Number(t.dataset.nav)); return; }
    if (t.dataset.faction) { S.faction = t.dataset.faction; save(); render(); return; }
    if (t.dataset.mcat) { S.mcat = Number(t.dataset.mcat); save(); render(); return; }
    if (t.dataset.prof) { S.prof = t.dataset.prof; save(); render(); return; }
    if (t.id === 'onlyProfit') { S.onlyProfit = !S.onlyProfit; save(); filterOpen ? refreshFilter() : render(); return; }
    if (t.id === 'onlyAH') { S.onlyAH = !S.onlyAH; save(); filterOpen ? refreshFilter() : render(); return; }
    if (t.hasAttribute('data-reset')) { Q[S.tab] = ''; if (S.tab === 'rezepte') { S.prof = 'Alle'; S.onlyProfit = false; S.onlyAH = false; S.skillMode = 'all'; } if (S.tab === 'markt') S.mcat = -1; save(); render(); return; }

    if (t.dataset.qset) { S.qty[sel.slice(2)] = Number(t.dataset.qset); save(); renderDetail(); return; }

    var p = t.parentElement && t.parentElement.id;
    if (p === 'mDevSeg') { S.mDev = t.dataset.v; save(); refreshFilter(); return; }

    if (t.id === 'resetBtn') { var fav = S.fav; S = Object.assign({}, DEFAULTS, { tab:'einstellungen', fav:fav, skills:{}, qty:{} }); save(); applyTheme(); render(); toast('Einstellungen zurückgesetzt (Merkliste bleibt)'); return; }
  });
  document.addEventListener('pointerdown', chartPoint);
  document.addEventListener('pointermove', function(e){ if (e.buttons || e.pointerType === 'mouse') chartPoint(e); });
  document.addEventListener('click', function(e){ if (e.target.id === 'sheetBg') closeSheet(); var mm = $('sortMenu'); if (mm && !e.target.closest('#sortMenu,#sortBtn')) mm.remove(); });
  document.addEventListener('keydown', function(e){

  });
  document.addEventListener('change', function(e){
    if (e.target.id === 'sort') { S.sort = e.target.value; save(); filterOpen ? refreshFilter() : render(); }
    if (e.target.id === 'fCat') { S.rcat = e.target.value; save(); refreshFilter(); }

  $('pane').addEventListener('touchstart', function(e){ if (e.target.closest('input,.stepper,.quick,#chart')) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
  $('pane').addEventListener('touchend', function(e){

  $('list').innerHTML = '<div class="empty">Lade Preise …</div>';
  Promise.all([
    fetch('./items.json').then(function(r){ return r.json(); }),

    fetch(DATA+'recipes.json', { cache:'no-cache' }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })

    checkVersion();

  }).catch(function(e){
    $('head').innerHTML = '<div class="brand">'+LOGO+'<h1>Forever AH</h1></div>';
    $('list').innerHTML = '<div class="empty">Preise konnten nicht geladen werden.<br>Läuft der Job schon (Reiter „Actions“)?<button type="button" class="btn" onclick="location.reload()">Neu laden</button></div>';
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(function(){});
  // ---------- App-Version ----------
  function vnum(v){ var p = String(v||'0').split('.').map(Number); while (p.length < 3) p.push(0); return p.reduce(function(a, x){ return a * 1000 + (x||0); }, 0); }
  function checkVersion(manual){
    fetch('./version.json?t=' + Date.now(), { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(v){
      if (v && vnum(v.version) > vnum(APP_VERSION)) {
        $('upd').innerHTML = '<div class="upd" role="status"><span>Neue Version <b>'+esc(v.version)+'</b> verfügbar</span><button type="button" class="btn primary" id="updBtn" data-v="'+esc(v.version)+'">Jetzt laden</button></div>';
      } else if (manual) toast('Du hast die neueste Version ('+APP_VERSION+')');

      + '<ul>'+list.map(function(t){ return '<li>'+esc(t)+'</li>'; }).join('')+'</ul><button type="button" class="btn primary" id="sheetOk">OK</button></div></div>';
  }
  function showNews(force){
    if (!force && S.seenVer === APP_VERSION) return;
    S.seenVer = APP_VERSION; save();
    $('sheet').innerHTML = newsHtml(APP_VERSION);
  }

  window.addEventListener('online', function(){ renderHead(); }); window.addEventListener('offline', function(){ renderHead(); });
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') checkVersion();
    if (document.visibilityState !== 'visible' || !SCANNED.A) return;
    fetch(DATA+'latest.json', { cache:'no-cache' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(L){
      if (!L || !L.scanned || L.scanned.A === SCANNED.A) return;
      SCANNED = L.scanned; SOURCE = L.source || SOURCE; SNAP = { A:L.A, H:L.H, N:L.N }; HIST = {}; render(); toast('Neue Preise geladen');
    }).catch(function(){});
  });
})();
